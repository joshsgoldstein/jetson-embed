[package]
name = "jetson-embed"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible text-embedding server for the Jetson AGX Orin, built on candle. A learning project: every module is documented in docs/."
license = "MIT"

[[bin]]
name = "jetson-embed"
path = "src/main.rs"

[dependencies]
# --- ML runtime (Hugging Face candle) -------------------------------------
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"

# --- HTTP server ------------------------------------------------------------
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# --- Plumbing ---------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Jetson / any NVIDIA GPU. Build ON the Jetson (aarch64 + CUDA toolkit present):
#   CUDA_COMPUTE_CAP=87 cargo build --release --features cuda
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Apple Silicon dev box, so the model runs on the Mac GPU while iterating.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
